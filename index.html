    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #000 url("assets/bg.webp") center/cover no-repeat;
        font-family: "Satoshi", sans-serif;
        overflow: hidden;
        color: #fff;
      }
      .snow {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 10;
      }
      .center-card {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(20, 20, 20, 0.25);
        border-radius: 28px;
        box-shadow: 0 2px 16px 0 rgba(0, 0, 0, 0.18);
        padding: 48px 36px 36px 36px;
        text-align: center;
        min-width: 340px;
        z-index: 20;
        backdrop-filter: blur(18px) saturate(120%);
        -webkit-backdrop-filter: blur(18px) saturate(120%);
        border: 1.5px solid rgba(255, 255, 255, 0.1);
      }
      .avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        object-fit: cover;
        margin-bottom: 16px;
        border: 3px solid #fff2;
        box-shadow: 0 0 16px #fff4;
        filter: grayscale(100%);
        -webkit-filter: grayscale(100%);
      }
      .nickname {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: 0.1px;
        position: relative;
        z-index: 1;
        display: block;
        left: 0;
        right: 0;
        text-align: center;
      }
      .glow {
        color: #fff;
        animation: glow-deform 4.2s ease-in-out infinite;
        text-shadow: 0 0 8px #111, 0 0 8px #fff, 0 0 16px #ccc, 0 2px 8px #ccc;
      }

      @keyframes glow-deform {
        0% {
          text-shadow: 0 0 8px #111, 0 0 8px #fff, 0 0 16px #ccc, 0 2px 8px #ccc;
          opacity: 0.94;
        }
        20% {
          text-shadow: 0 0 9px #111, 1px 0 10px #fff, -1px 0 18px #ccc,
            0 3px 9px #ccc;
          opacity: 1;
        }
        40% {
          text-shadow: 0 0 10px #111, -1px 0 10px #fff, 1px 0 18px #ccc,
            0 -1px 10px #ccc;
          opacity: 0.97;
        }
        60% {
          text-shadow: 0 0 9px #111, 0 1px 9px #fff, 0 -1px 17px #ccc,
            1px 0 9px #ccc;
          opacity: 1;
        }
        80% {
          text-shadow: 0 0 8px #111, 0 -1px 8px #fff, 0 1px 16px #ccc,
            -1px 0 8px #ccc;
          opacity: 0.96;
        }
        100% {
          text-shadow: 0 0 8px #111, 0 0 8px #fff, 0 0 16px #ccc, 0 2px 8px #ccc;
          opacity: 0.94;
        }
      }

      .desc {
        font-size: 1.1rem;
        font-weight: 600;
        color: #ccc;
        margin-bottom: 8px;
      }
      .location {
        font-size: 0.95rem;
        color: #fff;
        margin-bottom: 18px;
      }
      .discord-card {
        display: inline-flex;
        align-items: center;
        background: #23272a;
        border-radius: 12px;
        padding: 8px 16px;
        margin-bottom: 18px;
        box-shadow: 0 2px 8px #0004;
        font-size: 1rem;
        color: #fff;
        gap: 10px;
      }
      .icons {
        margin-top: 18px;
        display: flex;
        justify-content: center;
        gap: 8px;
      }
      .icons a,
      .icons .icon-copy {
        color: #fff;
        width: 36px;
        height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        border-radius: 50%;
        transition: transform 0.18s cubic-bezier(0.4, 2, 0.6, 1);
        cursor: url("assets/cursor.webp"), auto; /* добавлено, чтобы курсор не менялся */
        position: relative;
        background: none;
        border: none;
        outline: none;
        padding: 0;
      }
      .icons a:hover,
      .icons .icon-copy:hover {
        transform: scale(1.18);
      }
      .icons svg {
        width: 28px;
        height: 28px;
        display: block;
      }
      .icon-tooltip {
        visibility: hidden;
        opacity: 0;
        background: #23272a;
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 4px 10px;
        position: absolute;
        z-index: 99;
        bottom: 120%;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.5em;
        font-family: "Satoshi", Arial, sans-serif;
        pointer-events: none;
        transition: opacity 0.18s;
        white-space: nowrap;
      }
      .icon-copy:hover .icon-tooltip,
      .icon-copy:focus .icon-tooltip {
        visibility: visible;
        opacity: 1;
      }
      .backdrop {
        backdrop-filter: blur(8px) saturate(120%);
        -webkit-backdrop-filter: blur(8px) saturate(120%);
      }
    </style>
  </head>

      <script>
        function copyToClipboard(text, el) {
          navigator.clipboard.writeText(text).then(() => {
            document.querySelectorAll(".icon-tooltip").forEach((tip) => {
              if (!el.contains(tip)) {
                tip.style.opacity = "0";
                tip.style.visibility = "hidden";
              }
            });
            const tooltip = el.querySelector(".icon-tooltip");
            if (tooltip) {
              tooltip.textContent = "copied!";
              tooltip.style.visibility = "visible";
              tooltip.style.opacity = "1";
              setTimeout(() => {
                tooltip.textContent = "copy address";
                tooltip.style.opacity = "0";
                tooltip.style.visibility = "hidden";
              }, 1200);
            }
          });
        }

        document.querySelectorAll(".icon-copy").forEach((btn) => {
          btn.addEventListener("mouseenter", function () {
            document.querySelectorAll(".icon-tooltip").forEach((tip) => {
              if (!btn.contains(tip)) {
                tip.style.opacity = "0";
                tip.style.visibility = "hidden";
              }
            });
            const tooltip = btn.querySelector(".icon-tooltip");
            tooltip.style.visibility = "visible";
            tooltip.style.opacity = "1";
          });
          btn.addEventListener("mouseleave", function () {
            const tooltip = btn.querySelector(".icon-tooltip");
            tooltip.style.opacity = "0";
            setTimeout(() => {
              tooltip.style.visibility = "hidden";
            }, 180);
          });
        });

        async function renderDiscordCard() {
          const card = document.getElementById("discord-card-content");
          card.innerHTML = '<span style="color:#aaa;">loading...</span>';
          try {
            const res = await fetch(
              "https://api.lanyard.rest/v1/users/1116684894446288986"
            );
            const { data } = await res.json();
            const user = data.discord_user;
            let avatarUrl = user.avatar
              ? `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.webp?size=64`
              : "assets/avatar.jpg";
            let statusColor =
              {
                online: "#43b581",
                idle: "#faa61a",
                dnd: "#f04747",
                offline: "#747f8d",
              }[data.discord_status] || "#747f8d";
            let statusText =
              {
                online: "Online",
                idle: "Idle",
                dnd: "Do Not Disturb",
                offline: "Offline",
              }[data.discord_status] || "Offline";
            let activity =
              data.activities &&
              data.activities.length > 0 &&
              data.activities[0].state
                ? data.activities[0].state
                : "currently doing nothing";
            let username =
              (user.global_name || user.display_name) + ` <span style="color:#aaa;font-size:0.8em">(@${user.username})</span>`;
            let tag =
              user.discriminator && user.discriminator !== "0"
                ? `#${user.discriminator}`
                : "";
            let badge =
              user.primary_guild && user.primary_guild.badge
                ? `<img src="https://cdn.discordapp.com/badge-icons/8a88d63823d8a71cd5e390baa45efa02.png" alt="hypesquad badge" style="width:20px;height:20px;"><img src="https://cdn.discordapp.com/badge-icons/2ba85e8026a8614b640c2837bcdfe21b.png" alt="nitro badge" style="width:20px;height:20px;">`
                : "";
            card.innerHTML = `
          <div style="position:relative;">
            <img src="${avatarUrl}" alt="discord avatar" style="width:40px;height:40px;border-radius:50%;box-shadow:0 0 0 3px #23272a,0 2px 8px #0004;object-fit:cover;">
            <span style="position:absolute;bottom:2px;right:2px;width:13px;height:13px;border-radius:50%;background:${statusColor};border:2px solid #23272a;display:inline-block;"></span>
          </div>
          <div style="display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:2px;min-width:0;flex:1;">
            <span style="font-weight:600;font-size:1.08em;line-height:1.1;display:flex;align-items:center;gap:4px;">${username}${badge}</span>
            <span style="font-size:0.97em;color:#aaa;">${activity}</span>
          </div>
        `;
          } catch (e) {
            card.innerHTML =
              '<span style="color:#f04747;">lanyard api error!</span>';
          }
        }
        document.addEventListener("DOMContentLoaded", renderDiscordCard);
      </script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const canvas = document.querySelector(".snow");
        const ctx = canvas.getContext("2d");
        let w = window.innerWidth;
        let h = window.innerHeight;
        canvas.width = w;
        canvas.height = h;
        const SNOW_DENSITY = 9000;
        let numFlakes = Math.floor((w * h) / SNOW_DENSITY);
        let flakes = [];
        let wind = 0;
        let speed = 1;
        function random(min, max) {
          return Math.random() * (max - min) + min;
        }
        function createFlakes() {
          flakes = [];
          for (let i = 0; i < numFlakes; i++) {
            flakes.push({
              x: random(0, w),
              y: random(0, h),
              r: random(1.2, 3.5),
              d: random(0.5, 1.5),
              o: random(0.3, 0.9),
            });
          }
        }
        function drawFlakes() {
          ctx.clearRect(0, 0, w, h);
          ctx.save();
          ctx.globalAlpha = 0.8;
          ctx.fillStyle = "#fff";
          flakes.forEach((f) => {
            ctx.globalAlpha = f.o;
            ctx.beginPath();
            ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
            ctx.fill();
          });
          ctx.restore();
        }
        function moveFlakes() {
          flakes.forEach((f) => {
            f.y += f.d * speed;
            f.x += Math.sin(f.y / 30) * 0.6 + wind * f.d;
            if (f.y > h) {
              f.y = -f.r;
              f.x = random(0, w);
            }
            if (f.x < 0) f.x = w;
            if (f.x > w) f.x = 0;
          });
        }
        function animateSnow() {
          drawFlakes();
          moveFlakes();
          requestAnimationFrame(animateSnow);
        }
        window.addEventListener("resize", () => {
          w = window.innerWidth;
          h = window.innerHeight;
          canvas.width = w;
          canvas.height = h;
          numFlakes = Math.floor((w * h) / SNOW_DENSITY);
          createFlakes();
        });
        window.addEventListener("mousemove", (e) => {
          const rect = canvas.getBoundingClientRect();
          if (
            e.clientX >= rect.left &&
            e.clientX <= rect.right &&
            e.clientY >= rect.top &&
            e.clientY <= rect.bottom
          ) {
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top) / rect.height;
            wind = (x - 0.5) * 2;
            speed = 0.7 + y;
          } else {
            wind = 0;
            speed = 1;
          }
        });
        createFlakes();
        animateSnow();
      });
    </script>
  </body>
</html>
